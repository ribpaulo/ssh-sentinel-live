<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SSH Sentinel{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/" aria-label="Go to home page">
            <span class="brand-mark">S</span>
            <span>SSH Sentinel <small>Mini-SIEM</small></span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="/"{% if request.url.path != '/dashboard' %} class="is-active" aria-current="page"{% endif %}>Upload analysis</a>
            <a href="/dashboard"{% if request.url.path == '/dashboard' %} class="is-active" aria-current="page"{% endif %}>Live dashboard</a>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer>Local demo analysis · Persistent live data stays on this system</footer>
</body>
</html>
